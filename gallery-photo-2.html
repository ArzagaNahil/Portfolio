    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Galería de imágenes de Paisaje" data-i18n-attr="aria-label" data-i18n-key="lb_gallery_paisaje" aria-hidden="true">
        <div class="lightbox__backdrop" data-lb-close aria-hidden="true"></div>
        <figure class="lightbox__stage">
            <img class="lightbox__img" alt="">
        </figure>
        <button type="button" class="lightbox__btn lightbox__btn--prev" data-lb-prev aria-label="Imagen anterior" data-i18n-attr="aria-label" data-i18n-key="lb_prev">&#8249;</button>
        <button type="button" class="lightbox__btn lightbox__btn--next" data-lb-next aria-label="Imagen siguiente" data-i18n-attr="aria-label" data-i18n-key="lb_next">&#8250;</button>
        <button type="button" class="lightbox__btn lightbox__btn--close" data-lb-close aria-label="Cerrar" data-i18n-attr="aria-label" data-i18n-key="lb_close">&times;</button>
        <p class="lightbox__counter" data-lb-counter aria-live="polite"></p>
    </div>

    </main>
