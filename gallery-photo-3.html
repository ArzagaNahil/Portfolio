        <button type="button" class="lightbox__btn lightbox__btn--close" data-lb-close aria-label="Cerrar" data-i18n-attr="aria-label" data-i18n-key="lb_close">&times;</button>
        <p class="lightbox__counter" data-lb-counter aria-live="polite"></p>
