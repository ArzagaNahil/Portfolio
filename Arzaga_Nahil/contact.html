        <!-- CONTACT SECTION -->
        <section class="contact" id="contact">
            <div class="contact__card">
                <span class="contact__overline" data-i18n="c_over">Contacto</span>
                <h2 class="contact__title" data-i18n="c_title">Trabajemos juntos</h2>
                <p class="contact__sub" data-i18n="c_sub">Estoy abierto a nuevos proyectos, colaboraciones y oportunidades. Cuéntame de tu idea.</p>
                <form class="contact__form" action="#" method="POST">
                    <div class="form-group">
                        <label class="form-label" for="name" data-i18n="c_label_name">Nombre</label>
                        <input class="form-input" type="text" id="name" name="name" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email" data-i18n="c_label_email">Email</label>
                        <input class="form-input" type="email" id="email" name="email" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message" data-i18n="c_label_message">Mensaje</label>
                        <textarea class="form-input form-textarea" id="message" name="message" rows="4" required></textarea>
                    </div>
                    <button class="shiny-cta" type="submit"><span data-i18n="c_submit">Enviar mensaje</span></button>
                </form>
            </div>
        </section>
