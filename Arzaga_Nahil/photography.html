    <style>
        .page-photography main {
            grid-template-areas:
                'side side side frame frame frame'
                'photography photography photography photography photography photography';
        }

        .page-photography .photography {
            position: relative;
            z-index: 2;
            display: grid;
            place-items: center;
            padding: 6.5rem 2rem 4rem;
        }

        @media screen and (min-width: 54em) {
            .page-photography main {
                height: 100vh;
                overflow: hidden;
                grid-template-rows: 100%;
                grid-template-areas: 'photography photography photography photography photography photography';
            }

            .page-photography .photography {
                grid-area: photography;
            }

            .page-photography .frame {
                background: none;
                backdrop-filter: none;
                border: none;
                grid-area: photography;
                z-index: 3;
                display: grid;
                align-content: space-between;
                pointer-events: none;
                grid-template-columns: 50% 50%;
                grid-template-rows: auto auto auto;
                grid-template-areas:
                    '... ...'
                    '... ...'
                    'title links';
                padding: 1.5rem 2rem;
            }

            .page-photography .frame__links {
                grid-area: links;
                justify-self: end;
                align-self: end;
                pointer-events: auto;
            }

            .page-photography .frame__links img {
                width: 36px;
                height: 36px;
            }
        }
    </style>
    <script>document.documentElement.className="js";</script>
