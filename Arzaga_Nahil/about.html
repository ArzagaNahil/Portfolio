    <style>
        .page-about main {
            grid-template-areas:

        }

        .page-about .about {
            display: grid;
            place-items: center;
            padding: 5.5rem 2rem 2rem;
        }

        @media screen and (min-width: 54em) {
            .page-about main {
                height: 100vh;
                overflow: hidden;
                grid-template-rows: 100%;
                grid-template-areas: 'side side side about about about';
            }

            .page-about .about {
                grid-area: about;
                padding: 6.5rem 2rem 2rem;
            }

            .page-about .frame {
                background: none;
                backdrop-filter: none;
                border: none;
                grid-area: about;
                display: grid;
                align-content: space-between;
                pointer-events: none;
                grid-template-columns: 50% 50%;
                grid-template-rows: auto auto auto;
                grid-template-areas:
                    '... ...'
                    '... ...'
                    'title links';
                padding: 1.5rem 2rem;
            }

            .page-about .frame::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                pointer-events: none;
                width: 100%;
                height: 100%;
                z-index: 10;
                background: #000000;
                opacity: 0;
                transition: opacity 0.8s ease-in-out 0.3s;
            }

            .page-about .menu--open ~ .frame::after {
                opacity: 0.75;
                transition-delay: 0s;
                pointer-events: auto;
            }

            .page-about .frame__links {
                grid-area: links;
                justify-self: end;
                align-self: end;
                pointer-events: auto;
            }

            .page-about .frame__links img {
                width: 36px;
                height: 36px;
            }
        }
    </style>
