    <style>
    /* =====================================================================
       Convivencia con la demo importada. Nada de esto toca la demo: son
       reglas de esta página para que sus estilos no se coman los de la web
       (y al revés). La demo se ve igual que en la demo.
       ===================================================================== */
    /* La demo pinta body{background:#232323}: el fondo de la web manda. */
    body { background: #000000; }
    /* La demo pinta main{display:flex}: la rejilla de la web sigue mandando. */
    main { display: grid; }
    /* El contenedor de la demo es la sección .about de esta página. El
       margin-top baja la caja por debajo de la topnav fija; el padding que
       traía .about no servía porque no mueve a los hijos position:absolute,
       y .content lo es.

       La .about heredaba además el template de 2 columnas (0.85fr / 1fr), el
       gap y el place-items:stretch de la ficha de proyecto antigua (style.css
       322-340), que dejaban .pieces en la 1ª columna y pasándose de ancho. La
       demo es una sola caja centrada: se anulan aquí y se ocupa todo el ancho
       para que la foto quede centrada en el viewport como en la original. */
    .page-about .demo-page {
        position: relative;
        padding: 0;
        margin-top: 3.75rem;
        grid-column: 1 / -1;
        grid-template-columns: 1fr;
        gap: 0;
        place-items: center;
    }
    /* style.css define .content para esta rejilla; la demo lo usa como
       capa absoluta. grid-area le colocaría dentro de la rejilla de .about. */
    .demo-page .content { grid-area: auto; }
    /* style.css define .menu/.menu__item para el menú LetterShuffle de la
       web; la demo trae los suyos con otras reglas.
       El :not es imprescindible: sin él, este display:block (0,2,0 y va
       después) se comería el `display:none` de `.js .menu--code` de
       demo.css:226 y se verían los dos menús apilados. */
    .page-about .menu { pointer-events: auto; border-bottom: 0; }
    .page-about .menu:not(.menu--code) { display: block; }
    .page-about .menu__item { font-family: inherit; font-weight: inherit; font-size: inherit; line-height: inherit; color: inherit; white-space: normal; }
    /* La cortina negra de la web se aplica también al .loading de la demo
       (selector .js .loading). Esa cortina sí interesa; lo que no encaja es
       el círculo del spinner de la web sobre el texto "- - -" de la demo. */
    .page-about .loading::after { margin: 0; border-radius: 0; background: none; opacity: 1; }
    /* Los iconos sociales, en su sitio de siempre (esquina inferior derecha,
       grid-area: about), pero elevados por encima de .content (z-index 100)
       de la demo, que los taparía. */
    .page-about .frame__links { position: relative; z-index: 150; }
    /* Controles de la esquina fuera: la flecha previa y la gota se han
       quitado del HTML (y con ellos sus símbolos svg), y el botón
       hamburguesa se oculta aquí. Ese botón NO se puede borrar del DOM:
       tympMain.js lo referencia sin comprobar null (líneas 454, 666 y 738)
       y reventaría el cambio de modo. */
    .page-about .controls { display: none; }
    /* "Work with me" acababa pegado a los 3 iconos sociales de la esquina
       inferior derecha. Sube toda la fila (no solo el enlace) para no
       desincronizarlo del conmutador Designer/Coder: ahora queda un margen
       de 13-18px entre el enlace y los iconos. Solo >=54em, que es donde el
       frame existe; en móvil la demo no se mueve. */
    @media screen and (min-width: 54em) {
        .page-about .content__bottom { margin-bottom: 4.5rem; }
    }
    </style>
